active_modules:
  - id: adaptive-visual-sampling
    title: Adaptive Visual Sampling
    maturity: M2
    confidence: 0.94
    evidence: [F1-MEL-001, F1-SPDA-001, F2-ANA-001, F2-TRI-001, F2-CHR-001, F2-BODY-001, F2-STO-003, F2-ODO-004, F3-EVT-001, F3-EVT-004, F3-LCME-001, F3-AST-005]
    convergence: "Visual systems and engineered sensors can allocate sensing capacity non-uniformly across space, time, spectrum and state, and can actively reshape acquisition or sensing orientation according to task-relevant information under a finite budget. Dragonfly regional compound-eye specialization independently strengthens the spatial-allocation component: sensor area and resolution are concentrated into behaviorally relevant foveae/bands rather than distributed uniformly."
    specification:
      input: "video, asynchronous visual events, or synthetic visual scene"
      state_variables: [spatial_priority, temporal_change, spectral_information, adaptation_state, task_utility]
      active_acquisition: "optional optical/illumination/orientation modulation; orientation control remains disabled until the passive software baseline validates"
      sampling_map: "budget-constrained adaptive weighting across spatial, temporal, spectral and task-utility dimensions"
      output: "importance-weighted visual field plus retained-information and task-utility metrics"
    success_criterion: "At the same total data/event budget B, adaptive acquisition must improve at least one predefined protected metric without degrading the remaining protected metrics beyond tolerance."
    next_action: "Implement the existing software-only simulator comparing uniform sampling against passive adaptive budget allocation on synthetic scenes, logging task utility U_i; do not enable orientation control until this baseline passes."

  - id: multi-state-focus
    title: Multi-State Focus
    maturity: M1
    confidence: 0.66
    evidence: [F2-ANA-001, F3-XR-001, F3-LF-002]
    convergence: "Biological partitioning of visual function across optical domains and engineered focal/light-field state control both address heterogeneous viewing conditions by distributing optical function rather than relying on one universal state."
    evidence_correction: "F3-LF-002 now uses the verified metalens-array prototype: 50 deg experimental horizontal FOV, ~4 mm static eyebox, ~60 cm demonstrated depth range; 86 deg FOV is simulation only. Previously stored 80x80 deg, 6.7x6.7 mm and 0.25 m-to-infinity values were removed as unsupported by that source."
    next_action: "Formalize the relationship as a state-selection or continuous light-field model using only verified F3-XR-001/F3-LF-002 operating ranges; reject if the biological/digital link remains only descriptive."

  - id: retinal-measurement-stack
    title: Retinal Measurement Stack
    maturity: M2
    confidence: 0.84
    evidence: [F1-ETH-001, F3-AO-001, F3-AOOCT-003, F3-PDIV-006]
    convergence: "Subclinical visual change can appear in structural/electrophysiological measurements before conventional behavioral endpoints; retinal observability can be increased both at acquisition and computational-restoration stages, provided raw observations, transformations and uncertainty remain separable."
    specification: "project/modules/retinal-measurement-stack/spec.yaml"
    success_criterion: "Ingest at least two modality classes on a synthetic/public non-clinical test set; preserve 100% traceability from derived measurements to raw acquisition and processing parameters; any restoration must improve a predefined quality/separability metric without exceeding a fixed distortion tolerance."
    next_action: "Validate the M2 record schema and fix the restoration quality metric plus independent distortion tolerance before implementing the M3 data pipeline."

waiting:
  - id: subjective-objective-perception-gap
    evidence: [F1-LSD-001, F1-VSS-001]
    reason: "Evidence supports dissociation between subjective visual phenomena and some conventional psychophysical measurements, but no sufficiently strong cross-front architecture has yet emerged."
  - id: nonlinear-infrared-perception
    evidence: [F1-2PIR-001]
    reason: "Strong and materializable nonlinear visual phenomenon, but it does not yet justify displacing an active module without a stronger cross-front convergence."
  - id: distributed-body-optics
    evidence: [F2-CHR-001, F2-BODY-001]
    reason: "Strong evidence for spatial vision emerging from distributed receptors plus body-level optical screening; currently incorporated as supporting evidence for Adaptive Visual Sampling rather than promoted as a separate module."

