active_modules:
  - id: adaptive-visual-sampling
    title: Adaptive Visual Sampling
    maturity: M2
    confidence: 0.82
    evidence: [F1-MEL-001, F2-ANA-001, F2-TRI-001, F3-EVT-001]
    convergence: "Visual systems allocate sampling non-uniformly across space, time and signal relevance."
    specification:
      input: "asynchronous visual events or video stream"
      sampling_map: "spatial + temporal adaptive weighting"
      output: "importance-weighted visual field"
    success_criterion: "Against uniform sampling at equal event/data budget, preserve or improve target contrast/motion detectability while reducing processed samples."
    next_action: "Implement a safe software-only simulator comparing uniform versus adaptive spatial-temporal sampling on synthetic visual scenes."

  - id: multi-state-focus
    title: Multi-State Focus
    maturity: M1
    confidence: 0.68
    evidence: [F2-ANA-001, F3-XR-001]
    convergence: "Biological partitioning of visual function across optical domains and engineered discrete focal-state switching both solve heterogeneous viewing conditions by partition rather than one universal optical state."
    next_action: "Formalize the relationship as a state-selection model before any prototype; reject if it reduces to superficial analogy."

  - id: retinal-measurement-stack
    title: Retinal Measurement Stack
    maturity: M1
    confidence: 0.74
    evidence: [F1-ETH-001, F3-AO-001]
    convergence: "Subclinical visual change can appear in structural/electrophysiological measurements before conventional behavioral endpoints, while computational retinal imaging increases spatial/temporal observability."
    next_action: "Define a non-clinical multimodal data model linking structural, electrophysiological and perceptual measurements without diagnostic claims."

waiting:
