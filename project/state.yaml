program: FARMAKSIA
cohort: MAXINE
status: frozen
closed_on: 2026-09-16
automations: stopped

architecture:
  id: maxine-adaptive-observability
  title: MAXINE Adaptive Observability System
  maturity: M2
  specification: project/architecture.yaml
  thesis: "Allocate finite visual sensing capacity according to information/task demand while preserving provenance between acquisition, restoration and measurement."

retained_modules:
  - id: adaptive-visual-sampling
    title: Adaptive Visual Sampling
    maturity: M2
    role: sensing_policy
    specification: project/modules/adaptive-visual-sampling/spec.yaml
    evidence: [F1-MEL-001, F1-SPDA-001, F2-ANA-001, F2-TRI-001, F2-CHR-001, F2-BODY-001, F2-STO-003, F2-ODO-004, F3-EVT-001, F3-EVT-004, F3-LCME-001, F3-AST-005]
    success_criterion: "At the same total data/event budget B, adaptive acquisition must improve at least one predefined protected metric without degrading the remaining protected metrics beyond tolerance."
    m3_gate: "Working reproducible software artifact + equal-budget uniform baseline + measurable improvement + documented failure cases."

  - id: retinal-measurement-stack
    title: Retinal Measurement Stack
    maturity: M2
    role: measurement_integrity_and_observability
    specification: project/modules/retinal-measurement-stack/spec.yaml
    evidence: [F1-ETH-001, F3-AO-001, F3-AOOCT-003, F3-PDIV-006]
    success_criterion: "Ingest at least two modality classes on a synthetic/public non-clinical test set; preserve 100% traceability from derived measurements to raw acquisition and processing parameters; restoration must improve a predefined metric without exceeding an independent distortion tolerance."
    m3_gate: "Executable pipeline + validated record schema + raw/restored separation + fixed quality/distortion thresholds."

merged_modules:
  - id: multi-state-focus
    final_maturity: M1
    merged_into: adaptive-visual-sampling
    retained_as: optional_optical_state_operator
    archive: project/archive/multi-state-focus.yaml
    evidence: [F2-ANA-001, F3-XR-001, F3-LF-002]
    reason: "Valid optical-state evidence, but no sufficiently independent/testable cross-domain architecture to justify a standalone module."

deferred_leads:
  - id: subjective-objective-perception-gap
    evidence: [F1-LSD-001, F1-VSS-001]
    disposition: validation_caution
    reason: "Subjective visual phenomena and objective measurements can dissociate; preserve them as distinct variables rather than forcing a module."
  - id: nonlinear-infrared-perception
    evidence: [F1-2PIR-001]
    disposition: deferred
    reason: "Strong isolated phenomenon without sufficient cross-front architecture in this cohort."

absorbed_themes:
  - id: distributed-body-optics
    evidence: [F2-CHR-001, F2-BODY-001]
    absorbed_into: adaptive-visual-sampling
    reason: "Distributed sensing plus optical screening already functions as supporting evidence for nonuniform/adaptive sensing."

evidence_inventory:
  F1: 9
  F2: 12
  F3: 12
  total: 33
  policy: "All verified ledger records remain graph nodes. Lack of a design edge means not integrated, not invalid."

rules:
  maturity_scale: [M0, M1, M2, M3, M4, M5]
  require_traceability: true
  require_success_metric_from: M2
  require_real_artifact_from: M3
  no_numeric_confidence_without_calibration: true
  no_relation_from_keyword_overlap_only: true

closure:
  final_highest_maturity: M2
  m3_artifact_exists: false
  future_front_sets_use_new_repository: true
  decision_log: docs/decisions.md
  closure_audit: docs/closure.md

last_synthesis: 2026-09-16T02:57:00-03:00
